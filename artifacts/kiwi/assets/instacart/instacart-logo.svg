  component requires exists.

  TO REPLACE: download the official mark from the Instacart developer portal
  (CTA-design page) and overwrite THIS file with it, keeping the file name.
  If the portal only offers a PNG, save it as assets/instacart/
  instacart-logo.png and change the ONE require() line in
  components/InstacartButton.tsx to point at it.

  Until replaced, the CTA shows a blank 22 px slot where the mark belongs —
  visible on a device, invisible to typecheck and to the suite.
-->
